name: Matrix Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        jinja2-version: ["3.0.0", "3.1.0", "3.1.6"]

    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive --remote
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create test environment
        run: |
          # Create isolated environment for this combination
          uv venv test-env --python ${{ matrix.python-version }}
          
      - name: Install specific Jinja2 version and dependencies
        run: |
          uv pip install --venv test-env jinja2==${{ matrix.jinja2-version }} PyYAML deepmerge jsonschema pydantic
          
      - name: Install project and test dependencies
        run: |
          uv pip install --venv test-env -e .
          uv pip install --venv test-env pytest pytest-cov

      - name: Run tests
        run: |
          source test-env/bin/activate
          python -m pytest tests/ -v --tb=short